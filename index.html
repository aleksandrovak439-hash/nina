<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Нина — финал кастинга</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #050505;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
    color: #f2f2f2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .app-header {
    padding: 20px 16px 8px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    margin-bottom: 8px;
    background: rgba(5,5,5,0.9);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .app-header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #FFFFFF 0%, #C0C0C0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0;
    text-align: left;
  }

  .thankyou-block {
    text-align: center;
    padding: 48px 24px;
    margin: 20px 16px;
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
    border-radius: 48px;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(4px);
  }

  .thankyou-block h2 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #FFD700, #FFA500);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .thankyou-block p {
    font-size: 18px;
    color: #ccc;
    line-height: 1.5;
  }

  .thankyou-icon {
    font-size: 64px;
    margin-bottom: 24px;
    display: inline-block;
  }

  .approved-container {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
  }

  .approval-card {
    background: #121212;
    border-radius: 24px;
    padding: 12px;
    display: flex;
    gap: 16px;
    align-items: center;
    border: 1px solid rgba(255,255,255,0.05);
    transition: all 0.2s;
  }

  .approval-card .photo {
    width: 100px;
    height: 133px;
    flex-shrink: 0;
    border-radius: 18px;
    overflow: hidden;
    background: #2c2c2e;
  }

  .approval-card .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .approval-card .photo img:active {
    transform: scale(0.98);
  }

  .approval-card .info {
    flex: 1;
  }

  .approval-card .info strong {
    font-size: 17px;
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
  }

  .approval-card .info .details {
    font-size: 13px;
    color: #bcbcbc;
    margin: 6px 0;
  }

  .contacts-btn {
    background: #2c2c2e;
    border: none;
    border-radius: 40px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
  }

  .contacts-btn:active {
    transform: scale(0.96);
    background: #3a3a3c;
  }

  .empty-message {
    text-align: center;
    color: #6c6c70;
    padding: 48px 20px;
    font-size: 16px;
  }

  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(16px);
    cursor: pointer;
  }

  .modal-content {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 28px;
    overflow: auto;
    background: #121212;
    padding: 0;
    position: relative;
    cursor: default;
  }

  .modal-img {
    width: auto;
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    display: block;
    border-radius: 24px;
  }

  .modal-contacts {
    background: #1c1c1e;
    border-radius: 32px;
    padding: 28px 24px;
    width: 320px;
    max-width: 85vw;
    color: white;
    text-align: left;
  }

  .close-modal {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 32px;
    font-weight: 300;
    color: white;
    cursor: pointer;
    background: rgba(0,0,0,0.5);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 40px;
    transition: 0.2s;
  }

  .close-modal:hover {
    background: #ff3b30;
  }

  footer {
    text-align: center;
    font-size: 11px;
    color: #3a3a3c;
    margin-top: auto;
    padding: 24px 16px;
  }
</style>
</head>
<body>

<div id="home">
  <div class="app-header">
    <h1>🎬 Нина<br><span style="font-size: 14px; font-weight: normal; color:#aaa;">кастинг завершён</span></h1>
  </div>

  <div class="approved-container" id="approvedContainer"></div>

  <div class="thankyou-block">
    <div class="thankyou-icon">🎭✨</div>
    <h2>Благодарим за совместную работу!</h2>
    <p>Все персонажи на проект утверждены.<br>Кастинг завершён.</p>
  </div>

  <footer>Проект «Нина» • финальный состав</footer>
</div>

<div id="photoModal" class="modal" onclick="closePhotoModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <span class="close-modal" onclick="closePhotoModal()">×</span>
    <img id="modalPhotoImg" class="modal-img" src="" alt="полноразмерное фото">
  </div>
</div>

<div id="contactsModal" class="modal" onclick="closeContactsModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <span class="close-modal" onclick="closeContactsModal()">×</span>
    <div id="contactsModalBody" class="modal-contacts"></div>
  </div>
</div>

<script>
  // ---------- ВСЕ УТВЕРЖДЁННЫЕ (ранее + новые) ----------
  const approved = [
    {
      name: "Павел Волгин",
      role: "Врач",

      size: "183/50/43",
      video: "https://disk.yandex.ru/i/ljS-1ouGvJ489Q"
    },
    {
      name: "Ева Ждановская",
      role: "Пожилая женщина",
      img: "photos/Ждановская.jpg",
      age: "56",
      size: "172/46/39",
      education: "ЭДТ - Ю.Ярветт (Эстония), ВШРиС - В.Зиновьев (СПб)",
      video: "https://disk.yandex.ru/i/deMl1wwURkc4FA"
    },
    {
      name: "Артем Артемьев",
      role: "Конвойный",
      img: "photos/Артем.jpg",
      size: "180/52/42",
      note: "готов бриться",
      video: "https://disk.yandex.ru/i/Txzu8cNZwgT_Pw"
    },
    {
      name: "Владимир Парполов",
      role: "Парень",
      img: "photos/Парполов.jpg",
      size: "175/46/43",
      education: "абитуриент класса РГИСИ",
      video: "https://disk.yandex.ru/i/tBIAjd81mvf46Q"
    },
    {

      role: "Мастер по ремонту телефонов",
      img: "photos/Невский.jpg",
      age: "33",
      size: "177/50/42",
      education: "Проф актёр, РГИСИ 2021",
      video: "https://disk.yandex.ru/d/StXKpQ5yZ00ItQ"
    },
    {
      name: "Петр Лебедев",
      role: "Оперативник",
      img: "photos/Лебедев.jpg",
      age: "32",
      size: "170/48/40",
      video: "https://disk.yandex.ru/i/aeHqlZjkSEX8jA"
    },
    {
      name: "Дмитрий Раздымахо",
      role: "Курьер",
      img: "photos/Раздымахо.jpg",
      age: "22",
      size: "184/52/43",
      education: "СЗУ, 2025, Факультет музыки, театра и кино",
      video: "https://casting.filmtoolz.ru/3677389/?modal=actor#video"
    },
    {
      name: "Юрий Носиков",
      role: "Гардеробщик",
      img: "photos/Носиков.jpg",
      size: "175/50/43",
      video: "https://disk.yandex.ru/i/AMBnu41S-tTkbA"
    },
    {
      name: "Александр Алейнов",
      role: "Охранник СК",
      img: "photos/Алейнов.jpg",
      size: "175/48/41",
      video: "https://disk.yandex.ru/i/BnpYFQ9JOQJDGg"
    },
    {
      name: "Руслан Бердюгин",
      role: "Внук Серафимы (Виталик)",
      img: "photos/Руслан.jpg",
      video: "https://disk.yandex.ru/a/NZGUjpypUjqfGA"
    },
    {
      name: "Максим Шляхтин",
      role: "Врач скорой",
      img: "photos/Шляхтин.jpg",
      video: "https://disk.yandex.ru/i/cWoBYz2eSrnqkA"
    },
    {
      name: "Екатерина Королева",
      role: "Мастер",
      img: "photos/Королева.jpg",
      video: "https://disk.yandex.ru/i/aS-5DyymYJGk9Q"
    }
  ];

  // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function openFullImage(src) {
    const modal = document.getElementById('photoModal');
    const modalImg = document.getElementById('modalPhotoImg');
    modalImg.src = src;
    modal.style.display = 'flex';
  }

  function closePhotoModal(event) {
    if (event && event.target !== event.currentTarget && event.target.className !== 'close-modal') return;
    document.getElementById('photoModal').style.display = 'none';
    document.getElementById('modalPhotoImg').src = '';
  }

  function showContacts(actor) {
    const modal = document.getElementById('contactsModal');
    const bodyDiv = document.getElementById('contactsModalBody');
    let contactsHtml = `<h3>📞 ${escapeHtml(actor.name)}</h3>`;
    if (actor.contacts) {
      const c = actor.contacts;
      if (c.phone1) contactsHtml += `<p>📱 Телефон: <strong>${escapeHtml(c.phone1)}</strong></p>`;
      if (c.phone) contactsHtml += `<p>📱 Телефон: <strong>${escapeHtml(c.phone)}</strong></p>`;
      if (c.agent) contactsHtml += `<p>🎭 Агент: ${escapeHtml(c.agent)}</p>`;
      if (c.agentPhone) contactsHtml += `<p>📞 Агент: ${escapeHtml(c.agentPhone)}</p>`;
      if (c.agency) contactsHtml += `<p>🏢 Агентство: ${escapeHtml(c.agency)}</p>`;
      if (c.email) contactsHtml += `<p>✉️ Email: <strong>${escapeHtml(c.email)}</strong></p>`;
    } else {
      contactsHtml += `<p>Контакты не указаны</p>`;
    }
    bodyDiv.innerHTML = contactsHtml;
    modal.style.display = 'flex';
  }

  function closeContactsModal(event) {
    if (event && event.target !== event.currentTarget && event.target.className !== 'close-modal') return;
    document.getElementById('contactsModal').style.display = 'none';
  }

  function renderApproved() {
    const container = document.getElementById('approvedContainer');
    container.innerHTML = '';
    if (!approved.length) {
      container.innerHTML = '<div class="empty-message">Нет утверждённых актёров</div>';
      return;
    }
    approved.forEach(actor => {
      const detailsHtml = `${actor.age ? `📅 ${actor.age} ` : ''}${actor.size ? `📏 ${actor.size} ` : ''}${actor.education ? `🎓 ${actor.education} ` : ''}${actor.note ? `📌 ${actor.note} ` : ''}`;
      container.innerHTML += `
        <div class="approval-card">
          <div class="photo">
            <img src="${actor.img}" alt="${actor.name}" onclick="openFullImage('${actor.img}')">
          </div>
          <div class="info">
            <strong>${escapeHtml(actor.name)}</strong>
            <div class="details">${escapeHtml(actor.role)}<br>${detailsHtml}</div>
            <button class="contacts-btn" onclick="window.showContactsForActor(${JSON.stringify(actor).replace(/"/g, '&quot;')})">📋 Контакты</button>
          </div>
        </div>
      `;
    });
  }

  window.showContactsForActor = function(actorObj) {
    showContacts(actorObj);
  };
  window.openFullImage = openFullImage;
  window.closePhotoModal = closePhotoModal;
  window.closeContactsModal = closeContactsModal;

  renderApproved();
</script>

</body>
</html>
